# Nginx reverse proxy for production - handles static, rate limiting, caching
worker_processes auto;
events {
    worker_connections 4096;
}

http {
    upstream vibe_api {
        server api:8000;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=swipe_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=message_limit:10m rate=20r/s;

    # Proxy cache for discovery feed
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=feed_cache:10m inactive=5m max_size=1g;

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Gzip
        gzip on;
        gzip_types text/plain application/json image/svg+xml;
        gzip_min_length 1000;

        # API
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://vibe_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        location /api/v1/swipes {
            limit_req zone=swipe_limit burst=20 nodelay;
            proxy_pass http://vibe_api;
            include proxy_params;
        }

        location /api/v1/messaging/ {
            limit_req zone=message_limit burst=30 nodelay;
            proxy_pass http://vibe_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # WebSocket
        location /api/v1/messaging/ws {
            proxy_pass http://vibe_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Storage - with caching
        location /storage/ {
            proxy_pass http://vibe_api;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /health {
            proxy_pass http://vibe_api;
            access_log off;
        }

        location /metrics {
            # restrict to internal
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny all;
            proxy_pass http://vibe_api;
        }
    }
}
