apiVersion: v1
kind: Secret
metadata:
  name: vibe-secrets
type: Opaque
stringData:
  database-url: "postgresql+psycopg2://vibe:CHANGE_ME@rds-host:5432/vibecodetinder"
  redis-url: "redis://elasticache-host:6379/0"
  secret-key: "CHANGE_ME_SUPER_SECRET_32_CHARS_MIN"
  s3-access-key: "CHANGE_ME"
  s3-secret-key: "CHANGE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vibe-config
data:
  ENV: "production"
  S3_BUCKET_MEDIA: "vibe-media-prod"
  S3_BUCKET_MESSAGE_MEDIA: "vibe-message-media-prod"
  S3_REGION: "us-east-1"
  MAX_PHOTOS_PER_USER: "9"
  RECOMMENDATION_CACHE_TTL_SECONDS: "300"
