apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vibecodetinder-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80,"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/stickiness.enabled: "true"
    alb.ingress.kubernetes.io/stickiness.type: "lb_cookie"
    alb.ingress.kubernetes.io/stickiness.lb_cookie.duration_seconds: "86400"
spec:
  rules:
    - host: api.vibecodetinder.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vibecodetinder-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vibecodetinder-ws-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: ws.vibecodetinder.com
      http:
        paths:
          - path: /api/v1/messaging/ws
            pathType: Prefix
            backend:
              service:
                name: vibecodetinder-service
                port:
                  number: 80
